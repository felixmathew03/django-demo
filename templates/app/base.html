{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <style>
        
header{
    display: flex;
    justify-content: space-between;
    padding: 2%;
    align-items: center;
}
nav{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}
nav a {
    color: navy;
    text-decoration: none;
}
nav a:hover{
    color: red;
}
h1{
    color: red;
    text-align: center;
    padding: 2%;
    background-color: aliceblue;
}

    </style>
</head>
<body>
    <header>
        <h3>Synnefo</h3>
        <nav>
            <a href="/">Home</a>
            <a href="/students">Students</a>
            <a href="/about">About</a>
        </nav>
    </header>
    <main>
        {% block contents%}{% endblock %}
    </main>
    <footer>
        Synnefo 2026
    </footer>
</body>
</html>
