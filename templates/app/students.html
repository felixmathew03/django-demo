<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Students Page</h1>
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Result</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{student.name}}</td>
            <td>{{student.age}}</td>
            <td>
                {% if student.mark >= 40%}
                    Passed
                {% else%}
                    Failed
                {% endif %}
            </td>
            <td>
                <a href="./{{student.name}}">View details</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
